<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <!-- تنظیمات PWA برای نصب روی موبایل -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Breath Timer","short_name":"Breath","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22white%22/%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>
    <title>Ultimate Breath Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px;
            padding-top: max(8px, env(safe-area-inset-top));
            transition: background-color 4s ease;
        }

        /* تم‌های رنگی محیطی */
        body.theme-sleep { background-color: #020308; }
        body.theme-energy { background-color: #0a0805; }
        body.theme-stress { background-color: #050a08; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 14px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .stats { color: #fff; font-weight: 700; display: flex; gap: 10px; cursor: pointer; }
        .toggles button, .install-btn {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 5px 9px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 4px;
            transition: 0.2s;
        }
        .toggles button.active, .install-btn { color: #fff; border-color: #fff; display: inline-flex; align-items: center; gap: 3px;}

        h1 {
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 20px;
            flex-shrink: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px;
            max-width: 500px;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .tab {
            flex: 1;
            padding: 8px 5px;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-size: 13px;
        }
        .tab.active { color: #fff; border-bottom-color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background-color: #111111;
            color: #fff;
            border: 1px solid #333;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .description {
            font-size: 13px;
            color: #888;
            margin-bottom: 14px;
            min-height: 34px;
            line-height: 1.5;
        }

        #particleCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .breath-circle-container {
            width: 170px;
            height: 170px;
            margin: 0 auto 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            flex-shrink: 1;
        }

        .breath-shape {
            width: 130px;
            height: 130px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 4s ease-in-out, border-radius 4s ease-in-out, box-shadow 2s;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* نقاط تمرکز چشم در حالت تمام صفحه */
        .focus-points {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }
        .fp {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        .phase-text { font-size: 20px; font-weight: 700; color: #000; padding: 0 10px; }
        .countdown { font-size: 16px; margin-top: 4px; font-weight: 300; color: #333; }

        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; flex-shrink: 0; }
        button { padding: 11px 24px; border: none; border-radius: 50px; font-size: 15px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-start { background: #fff; color: #000; }
        .btn-stop { background: transparent; color: #fff; border: 1px solid #fff; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .routine-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .routine-btns button { flex: 1; background: #222; color: #fff; border: 1px solid #444; min-width: 100px;}

        /* مودال آمار */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid #333;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 20px;
        }
        .cal-day {
            aspect-ratio: 1;
            background: #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #555;
        }
        .cal-day.active { background: #fff; color: #000; font-weight: bold; }

        .container.fullscreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            max-width: 100%; height: 100vh; height: 100dvh;
            background: #000; border: none; border-radius: 0;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 999;
        }
        .container.fullscreen .top-bar,
        .container.fullscreen h1,
        .container.fullscreen .tabs,
        .container.fullscreen .description { display: none; }
        .container.fullscreen .focus-points { display: block; }
        .exit-fullscreen {
            position: absolute; top: 20px; left: 20px;
            background: transparent; border: 1px solid #333;
            color: #fff; border-radius: 50%;
            width: 40px; height: 40px; display: none;
        }
        .container.fullscreen .exit-fullscreen { display: block; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <button class="exit-fullscreen" onclick="toggleFullscreen()">✕</button>
        <div class="focus-points">
            <div class="fp" style="top: 10%; left: 50%;"></div>
            <div class="fp" style="top: 50%; left: 10%;"></div>
            <div class="fp" style="top: 50%; left: 90%;"></div>
            <div class="fp" style="top: 90%; left: 50%;"></div>
        </div>

        <div class="top-bar">
            <div class="stats" onclick="openStats()">
                <span id="streakCounter">🔥 0 روز</span>
                <span id="totalMinutes">⏱️ 0 دقیقه</span>
            </div>
            <div class="toggles">
                <button id="installBtn" class="install-btn" style="display:none">📥 نصب</button>
                <button id="soundToggle" onclick="toggleSetting('sound')">🔊</button>
                <button id="langToggle" onclick="toggleLanguage()">🌐 EN</button>
                <button onclick="toggleFullscreen()">⛶</button>
            </div>
        </div>

        <h1>BREATH TIMER</h1>

        <div class="tabs">
            <div class="tab active" id="tabPresets" onclick="switchTab('presets')">پیش‌فرض</div>
            <div class="tab" id="tabCustom" onclick="switchTab('custom')">سفارشی</div>
            <div class="tab" id="tabRoutines" onclick="switchTab('routines')">روتین‌ها</div>
            <div class="tab" id="tabApnea" onclick="switchTab('apnea')">غواصی</div>
        </div>

        <!-- تب پیش‌فرض -->
        <div id="presets" class="tab-content active">
            <select id="methodSelect" onchange="updateMethodInfo()">
                <option value="wim_hof_30">Wim Hof (حبس ۳۰ ثانیه)</option>
                <option value="wim_hof_60">Wim Hof (حبس ۱ دقیقه)</option>
                <option value="wim_hof_120">Wim Hof (حبس ۲ دقیقه)</option>
                <option value="box_4444" selected>4-4-4-4 (مربعی)</option>
                <option value="tactical_box">4-4-4-4 (تاکتیکی)</option>
                <option value="coherent_55">5.5-5.5 (هماهنگ)</option>
                <option value="relax_448">4-4-8 (آرام‌بخش)</option>
                <option value="alternate_nostril">از یک سوراخ (نادی شودانا)</option>
                <option value="physio_sigh">آه فیزیولوژیک (1-1-6)</option>
                <option value="tactical_333">3-3-3 (رزمی)</option>
                <option value="weil_478">4-7-8 (دکتر ویل)</option>
                <option value="deep_527">5-2-7 (دیافراگمی)</option>
                <option value="resonant_66">6-6 (HRV)</option>
                <option value="bhastrika_11">1-1 (آتشین)</option>
                <option value="cadence_22">2-2 (دویدن/ریتم)</option>
            </select>
            <div class="description" id="methodDescription">یک روش را انتخاب کنید.</div>
        </div>

        <!-- تب سفارشی -->
        <div id="custom" class="tab-content">
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex:1"><label id="lblCIn">درون (ثانیه)</label><input type="number" id="cIn" value="4" step="0.5"></div>
                <div style="flex:1"><label id="lblCHold1">حبس ۱</label><input type="number" id="cHold1" value="4" step="0.5"></div>
                <div style="flex:1"><label id="lblCOut">بیرون</label><input type="number" id="cOut" value="4" step="0.5"></div>
                <div style="flex:1"><label id="lblCHold2">حبس ۲</label><input type="number" id="cHold2" value="4" step="0.5"></div>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex:1"><label id="lblTxtIn">کلمه درون</label><input type="text" id="txtIn" value="درون"></div>
                <div style="flex:1"><label id="lblTxtOut">کلمه بیرون</label><input type="text" id="txtOut" value="بیرون"></div>
            </div>
            <div class="description" id="customDesc">زمان‌ها و کلمات (Mantra) خود را وارد کنید.</div>
        </div>

        <!-- تب روتین‌ها -->
        <div id="routines" class="tab-content">
            <div class="description" id="routinesDesc">یک هدف انتخاب کنید تا تایمر با تم رنگی مخصوص خود شروع شود:</div>
            <div class="routine-btns">
                <button onclick="setRoutine('sleep')"><span id="btnSleep">😴 خواب</span><br><small>4-7-8</small></button>
                <button onclick="setRoutine('stress')"><span id="btnStress">🧘 آرامش</span><br><small>5.5-5.5</small></button>
                <button onclick="setRoutine('energy')"><span id="btnEnergy">⚡ انرژی</span><br><small>1-1</small></button>
            </div>
        </div>

        <!-- تب جداول آپنه -->
        <div id="apnea" class="tab-content">
            <select id="apneaType" onchange="updateApneaInfo()">
                <option value="co2">جدول CO2 (استقامت در برابر دی‌اکسید کربن)</option>
                <option value="o2">جدول O2 (استقامت در برابر کمبود اکسیژن)</option>
            </select>
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex:1"><label id="lblApneaBase">زمان پایه (ثانیه)</label><input type="number" id="apneaBase" value="30"></div>
            </div>
            <div class="description" id="apneaDesc">در این جدول زمان استراحت کم می‌شود و حبس ثابت می‌ماند.</div>
        </div>

        <canvas id="particleCanvas"></canvas>

        <div class="breath-circle-container">
            <div class="breath-shape" id="breathShape" style="transform: scale(1); border-radius: 50%;">
                <div class="phase-text" id="phaseText">آماده</div>
                <div class="countdown" id="countdown"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startBreathing()">شروع</button>
            <button class="btn-stop" id="stopBtn" onclick="stopBreathing(true)" disabled>توقف</button>
        </div>
    </div>

    <!-- مودال آمار -->
    <div class="modal" id="statsModal" onclick="closeStats()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="modalTitle">آمار تمرینات شما</h2>
            <p id="modalStatsText"></p>
            <div class="calendar-grid" id="calendarGrid"></div>
            <br>
            <button id="modalCloseBtn" onclick="closeStats()" style="background:#fff;color:#000;margin-top:20px">بستن</button>
        </div>
    </div>

    <script>
        // --- ترجمه‌ها / Translations ---
        const UI = {
            fa: {
                tabPresets: "پیش‌فرض", tabCustom: "سفارشی", tabRoutines: "روتین‌ها", tabApnea: "غواصی",
                methodDescPlaceholder: "یک روش را انتخاب کنید.",
                lblCIn: "درون (ثانیه)", lblCHold1: "حبس ۱", lblCOut: "بیرون", lblCHold2: "حبس ۲",
                lblTxtIn: "کلمه درون", lblTxtOut: "کلمه بیرون",
                customDesc: "زمان‌ها و کلمات (Mantra) خود را وارد کنید.",
                customDefaultIn: "درون", customDefaultOut: "بیرون",
                routinesDesc: "یک هدف انتخاب کنید تا تایمر با تم رنگی مخصوص خود شروع شود:",
                btnSleep: "😴 خواب", btnStress: "🧘 آرامش", btnEnergy: "⚡ انرژی",
                lblApneaBase: "زمان پایه (ثانیه)",
                ready: "آماده", start: "شروع", stop: "توقف",
                modalTitle: "آمار تمرینات شما", modalClose: "بستن",
                installBtn: "📥 نصب", langBtn: "🌐 EN",
                streak: n => `🔥 ${n} روز`, minutes: n => `⏱️ ${n} دقیقه`,
                alertMinInput: "حداقل یک زمان وارد کنید",
                apneaOptions: { co2: "جدول CO2 (استقامت در برابر دی‌اکسید کربن)", o2: "جدول O2 (استقامت در برابر کمبود اکسیژن)" },
                apneaDesc: { co2: "زمان استراحت هر مرحله کم می‌شود، زمان حبس ثابت است.", o2: "زمان استراحت ثابت است، زمان حبس هر مرحله بیشتر می‌شود." },
                methodOptions: {
                    wim_hof_30: "Wim Hof (حبس ۳۰ ثانیه)", wim_hof_60: "Wim Hof (حبس ۱ دقیقه)", wim_hof_120: "Wim Hof (حبس ۲ دقیقه)",
                    box_4444: "4-4-4-4 (مربعی)", tactical_box: "4-4-4-4 (تاکتیکی)", coherent_55: "5.5-5.5 (هماهنگ)",
                    relax_448: "4-4-8 (آرام‌بخش)", alternate_nostril: "از یک سوراخ (نادی شودانا)", physio_sigh: "آه فیزیولوژیک (1-1-6)",
                    tactical_333: "3-3-3 (رزمی)", weil_478: "4-7-8 (دکتر ویل)", deep_527: "5-2-7 (دیافراگمی)",
                    resonant_66: "6-6 (HRV)", bhastrika_11: "1-1 (آتشین)", cadence_22: "2-2 (دویدن/ریتم)"
                }
            },
            en: {
                tabPresets: "Presets", tabCustom: "Custom", tabRoutines: "Routines", tabApnea: "Apnea",
                methodDescPlaceholder: "Select a method.",
                lblCIn: "Inhale (sec)", lblCHold1: "Hold 1", lblCOut: "Exhale", lblCHold2: "Hold 2",
                lblTxtIn: "Inhale word", lblTxtOut: "Exhale word",
                customDesc: "Enter your own timings and words (mantra).",
                customDefaultIn: "Inhale", customDefaultOut: "Exhale",
                routinesDesc: "Choose a goal to start the timer with its matching color theme:",
                btnSleep: "😴 Sleep", btnStress: "🧘 Relax", btnEnergy: "⚡ Energy",
                lblApneaBase: "Base time (sec)",
                ready: "Ready", start: "Start", stop: "Stop",
                modalTitle: "Your Practice Stats", modalClose: "Close",
                installBtn: "📥 Install", langBtn: "🌐 FA",
                streak: n => `🔥 ${n} days`, minutes: n => `⏱️ ${n} min`,
                alertMinInput: "Enter at least one duration",
                apneaOptions: { co2: "CO2 Table (CO2 tolerance)", o2: "O2 Table (low oxygen tolerance)" },
                apneaDesc: { co2: "Rest time decreases each round; hold time stays fixed.", o2: "Rest time stays fixed; hold time increases each round." },
                methodOptions: {
                    wim_hof_30: "Wim Hof (30s hold)", wim_hof_60: "Wim Hof (1 min hold)", wim_hof_120: "Wim Hof (2 min hold)",
                    box_4444: "4-4-4-4 (Box)", tactical_box: "4-4-4-4 (Tactical)", coherent_55: "5.5-5.5 (Coherent)",
                    relax_448: "4-4-8 (Relaxing)", alternate_nostril: "Alternate Nostril (Nadi Shodhana)", physio_sigh: "Physiological Sigh (1-1-6)",
                    tactical_333: "3-3-3 (Combat)", weil_478: "4-7-8 (Dr. Weil)", deep_527: "5-2-7 (Diaphragmatic)",
                    resonant_66: "6-6 (HRV)", bhastrika_11: "1-1 (Fire / Bhastrika)", cadence_22: "2-2 (Running Cadence)"
                }
            }
        };

        let currentLang = localStorage.getItem('breathLang') || 'fa';

        // --- تابع ساخت Wim Hof ---
        function generateWimHofMethod(holdSeconds) {
            let phases = [];
            for(let i=1; i<=30; i++) {
                phases.push({ text: { fa: `نفس کشیدن (${i}/30)`, en: `Breathe in (${i}/30)` }, duration: 1.5, action: "expand" });
                phases.push({ text: { fa: "بیرون دادن", en: "Breathe out" }, duration: 1.5, action: "contract" });
            }
            phases.push({ text: { fa: "حبس نفس بعد از بازدم", en: "Hold after exhale" }, duration: holdSeconds, action: "hold" });
            phases.push({ text: { fa: "نفس عمیق بکش", en: "Take a deep breath" }, duration: 2.0, action: "expand" });
            phases.push({ text: { fa: "حبس نفس (ریکاوری)", en: "Hold (recovery)" }, duration: 15.0, action: "hold" });
            return {
                name: { fa: "ویم هوف", en: "Wim Hof" },
                type: "wimhof",
                desc: { fa: `۳۰ نفس سریع، حبس ${holdSeconds} ثانیه، ریکاوری ۱۵ ثانیه.`, en: `30 quick breaths, ${holdSeconds}s hold, 15s recovery.` },
                phases: phases
            };
        }

        // --- اطلاعات متدها ---
        const methods = {
            wim_hof_30: generateWimHofMethod(30),
            wim_hof_60: generateWimHofMethod(60),
            wim_hof_120: generateWimHofMethod(120),
            box_4444: { name: { fa: "4-4-4-4", en: "4-4-4-4" }, type: "normal", desc: { fa: "تمرکز و کاهش استرس.", en: "Focus and stress reduction." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 4.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 4.0, action: "hold" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 4.0, action: "contract" },
                { text: { fa: "حبس", en: "Hold" }, duration: 4.0, action: "hold" }
            ]},
            tactical_box: { name: { fa: "4-4-4-4 تاکتیکی", en: "4-4-4-4 Tactical" }, type: "tactical", desc: { fa: "تمرکز نظامی با بیپ‌های کوتاه.", en: "Military focus with short beeps." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 4.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 4.0, action: "hold" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 4.0, action: "contract" },
                { text: { fa: "حبس", en: "Hold" }, duration: 4.0, action: "hold" }
            ]},
            coherent_55: { name: { fa: "5.5-5.5", en: "5.5-5.5" }, type: "normal", desc: { fa: "تعادل سیستم عصبی.", en: "Nervous system balance." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 5.5, action: "expand" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 5.5, action: "contract" }
            ]},
            relax_448: { name: { fa: "4-4-8", en: "4-4-8" }, type: "normal", desc: { fa: "نفس آرام‌بخش برای خواب.", en: "Calming breath for sleep." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 4.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 4.0, action: "hold" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 8.0, action: "contract" }
            ]},
            alternate_nostril: { name: { fa: "نادی شودانا", en: "Nadi Shodhana" }, type: "normal", desc: { fa: "تنفس متناوب.", en: "Alternate nostril breathing." }, phases: [
                { text: { fa: "درون (چپ)", en: "Inhale (left)" }, duration: 4.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 4.0, action: "hold" },
                { text: { fa: "بیرون (راست)", en: "Exhale (right)" }, duration: 4.0, action: "contract" },
                { text: { fa: "درون (راست)", en: "Inhale (right)" }, duration: 4.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 4.0, action: "hold" },
                { text: { fa: "بیرون (چپ)", en: "Exhale (left)" }, duration: 4.0, action: "contract" }
            ]},
            physio_sigh: { name: { fa: "آه فیزیولوژیک", en: "Physiological Sigh" }, type: "normal", desc: { fa: "آرامش فوری.", en: "Instant relaxation." }, phases: [
                { text: { fa: "درون (شکم)", en: "Inhale (belly)" }, duration: 1.0, action: "expand" },
                { text: { fa: "درون (سینه)", en: "Inhale (chest)" }, duration: 1.0, action: "expand" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 6.0, action: "contract" }
            ]},
            tactical_333: { name: { fa: "3-3-3", en: "3-3-3" }, type: "normal", desc: { fa: "نفس رزمی.", en: "Combat breathing." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 3.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 3.0, action: "hold" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 3.0, action: "contract" },
                { text: { fa: "حبس", en: "Hold" }, duration: 3.0, action: "hold" }
            ]},
            weil_478: { name: { fa: "4-7-8", en: "4-7-8" }, type: "normal", desc: { fa: "خواب عمیق.", en: "Deep sleep." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 4.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 7.0, action: "hold" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 8.0, action: "contract" }
            ]},
            deep_527: { name: { fa: "5-2-7", en: "5-2-7" }, type: "normal", desc: { fa: "تنفس عمیق.", en: "Deep breathing." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 5.0, action: "expand" },
                { text: { fa: "حبس", en: "Hold" }, duration: 2.0, action: "hold" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 7.0, action: "contract" }
            ]},
            resonant_66: { name: { fa: "6-6", en: "6-6" }, type: "normal", desc: { fa: "تنفس HRV.", en: "HRV breathing." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 6.0, action: "expand" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 6.0, action: "contract" }
            ]},
            bhastrika_11: { name: { fa: "1-1", en: "1-1" }, type: "normal", desc: { fa: "نفس آتشین.", en: "Fire breath (Bhastrika)." }, phases: [
                { text: { fa: "درون قوی", en: "Strong inhale" }, duration: 1.0, action: "expand" },
                { text: { fa: "بیرون قوی", en: "Strong exhale" }, duration: 1.0, action: "contract" }
            ]},
            cadence_22: { name: { fa: "2-2", en: "2-2" }, type: "normal", desc: { fa: "ریتم دویدن.", en: "Running cadence." }, phases: [
                { text: { fa: "درون", en: "Inhale" }, duration: 2.0, action: "expand" },
                { text: { fa: "بیرون", en: "Exhale" }, duration: 2.0, action: "contract" }
            ]}
        };

        let currentMethod = methods.box_4444;
        let currentPhaseIndex = 0;
        let phaseTimeout, countdownInterval;
        let isRunning = false;
        let settings = { sound: false, voice: false };
        let audioCtx = null;
        let sessionStartTime = 0;

        const shape = document.getElementById('breathShape');
        const phaseText = document.getElementById('phaseText');
        const countdown = document.getElementById('countdown');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const methodSelect = document.getElementById('methodSelect');

        // --- آمار و تقویم ---
        function updateStatsUI() {
            let streak = localStorage.getItem('breathStreak') || 0;
            let totalSecs = parseInt(localStorage.getItem('breathTotalSecs') || 0);
            let mins = Math.floor(totalSecs / 60);

            document.getElementById('streakCounter').innerText = UI[currentLang].streak(streak);
            document.getElementById('totalMinutes').innerText = UI[currentLang].minutes(mins);
        }

        function saveSession(durationSecs) {
            let today = new Date().toDateString();
            let lastDate = localStorage.getItem('breathLastDate');

            if (lastDate !== today) {
                let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                let streak = parseInt(localStorage.getItem('breathStreak') || 0);
                if (lastDate === yesterday.toDateString()) streak += 1;
                else streak = 1;
                localStorage.setItem('breathStreak', streak);
                localStorage.setItem('breathLastDate', today);
                localStorage.setItem('breathDate-'+today, 'true');
            }

            let total = parseInt(localStorage.getItem('breathTotalSecs') || 0);
            localStorage.setItem('breathTotalSecs', total + durationSecs);
            updateStatsUI();
        }

        function openStats() {
            let modal = document.getElementById('statsModal');
            let grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            let today = new Date();
            for(let i=29; i>=0; i--) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let dStr = d.toDateString();
                let div = document.createElement('div');
                div.className = 'cal-day' + (localStorage.getItem('breathDate-'+dStr) ? ' active' : '');
                div.innerText = d.getDate();
                grid.appendChild(div);
            }
            modal.style.display = 'flex';
        }
        function closeStats() { document.getElementById('statsModal').style.display = 'none'; }

        // --- آپنه ---
        function generateApneaTable(type, baseTime) {
            let phases = [];
            if(type === 'co2') {
                for(let i=0; i<8; i++) {
                    let restTime = Math.max(15, 60 - (i*7)); // استراحت کم میشه
                    phases.push({ text: { fa: `آماده (استراحت ${restTime}s)`, en: `Ready (rest ${restTime}s)` }, duration: restTime, action: "contract" });
                    phases.push({ text: { fa: `حبس نفس (${baseTime}s)`, en: `Breath hold (${baseTime}s)` }, duration: baseTime, action: "hold" });
                }
            } else {
                for(let i=0; i<8; i++) {
                    phases.push({ text: { fa: `آماده (استراحت 60s)`, en: `Ready (rest 60s)` }, duration: 60, action: "contract" });
                    let holdTime = baseTime + (i*7); // حبس بیشتر میشه
                    phases.push({ text: { fa: `حبس نفس (${holdTime}s)`, en: `Breath hold (${holdTime}s)` }, duration: holdTime, action: "hold" });
                }
            }
            return { name: { fa: "آپنه", en: "Apnea" }, type: "apnea", desc: { fa: "جدول تمرین غواصی.", en: "Freediving training table." }, phases: phases };
        }

        function updateApneaInfo() {
            let type = document.getElementById('apneaType').value;
            document.getElementById('apneaDesc').innerText = UI[currentLang].apneaDesc[type];
        }

        // --- تب‌ها و روتین‌ها ---
        function switchTab(tabName) {
            stopBreathing(true);
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        function updateMethodInfo() {
            currentMethod = methods[methodSelect.value];
            document.getElementById('methodDescription').innerText = currentMethod.desc[currentLang];
            stopBreathing(true);
        }

        function setRoutine(type) {
            document.body.className = ''; // ریست تم
            switchTab('presets');
            if (type === 'sleep') { methodSelect.value = 'weil_478'; document.body.classList.add('theme-sleep'); }
            if (type === 'stress') { methodSelect.value = 'coherent_55'; document.body.classList.add('theme-stress'); }
            if (type === 'energy') { methodSelect.value = 'bhastrika_11'; document.body.classList.add('theme-energy'); }
            updateMethodInfo();
            startBreathing();
        }

        // --- صدا ---
        function toggleSetting(type) {
            settings[type] = !settings[type];
            document.getElementById(type + 'Toggle').classList.toggle('active', settings[type]);
            if (settings.sound && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(freq = 300) {
            if (!settings.sound || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function speak(text) {
            if (!settings.voice) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = currentLang === 'fa' ? 'fa-IR' : 'en-US'; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        // --- زبان / Language ---
        function toggleLanguage() {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            localStorage.setItem('breathLang', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const t = UI[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

            document.getElementById('tabPresets').innerText = t.tabPresets;
            document.getElementById('tabCustom').innerText = t.tabCustom;
            document.getElementById('tabRoutines').innerText = t.tabRoutines;
            document.getElementById('tabApnea').innerText = t.tabApnea;

            // گزینه‌های متد
            Object.keys(t.methodOptions).forEach(key => {
                const opt = methodSelect.querySelector(`option[value="${key}"]`);
                if (opt) opt.innerText = t.methodOptions[key];
            });
            document.getElementById('methodDescription').innerText = currentMethod.desc[currentLang];

            document.getElementById('lblCIn').innerText = t.lblCIn;
            document.getElementById('lblCHold1').innerText = t.lblCHold1;
            document.getElementById('lblCOut').innerText = t.lblCOut;
            document.getElementById('lblCHold2').innerText = t.lblCHold2;
            document.getElementById('lblTxtIn').innerText = t.lblTxtIn;
            document.getElementById('lblTxtOut').innerText = t.lblTxtOut;
            document.getElementById('customDesc').innerText = t.customDesc;

            // اگر ورودی کلمه هنوز مقدار پیش‌فرض زبان قبلی بود، به زبان جدید سوییچ کن
            const otherLang = currentLang === 'fa' ? 'en' : 'fa';
            const txtIn = document.getElementById('txtIn');
            const txtOut = document.getElementById('txtOut');
            if (txtIn.value === UI[otherLang].customDefaultIn) txtIn.value = t.customDefaultIn;
            if (txtOut.value === UI[otherLang].customDefaultOut) txtOut.value = t.customDefaultOut;

            document.getElementById('routinesDesc').innerText = t.routinesDesc;
            document.getElementById('btnSleep').innerText = t.btnSleep;
            document.getElementById('btnStress').innerText = t.btnStress;
            document.getElementById('btnEnergy').innerText = t.btnEnergy;

            document.getElementById('lblApneaBase').innerText = t.lblApneaBase;
            Object.keys(t.apneaOptions).forEach(key => {
                const opt = document.querySelector(`#apneaType option[value="${key}"]`);
                if (opt) opt.innerText = t.apneaOptions[key];
            });
            updateApneaInfo();

            if (!isRunning) phaseText.innerText = t.ready;
            startBtn.innerText = t.start;
            stopBtn.innerText = t.stop;

            document.getElementById('modalTitle').innerText = t.modalTitle;
            document.getElementById('modalCloseBtn').innerText = t.modalClose;

            document.getElementById('installBtn').innerText = t.installBtn;
            document.getElementById('langToggle').innerText = t.langBtn;

            updateStatsUI();
        }

        // --- فول اسکرین ---
        function toggleFullscreen() { document.getElementById('mainContainer').classList.toggle('fullscreen'); }

        // --- ذرات ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function createParticles(action) {
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({ x: canvas.width / 2, y: canvas.height / 2, angle: Math.random() * Math.PI * 2, speed: Math.random() * 0.5 + 0.5, action });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            particles.forEach(p => {
                if (p.action === 'expand') { p.x += Math.cos(p.angle) * p.speed; p.y += Math.sin(p.angle) * p.speed; }
                else if (p.action === 'contract') { p.x -= Math.cos(p.angle) * p.speed; p.y -= Math.sin(p.angle) * p.speed; }
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
            });
            if (isRunning) requestAnimationFrame(animateParticles);
        }

        // --- شروع تمرین ---
        function startBreathing() {
            if (document.getElementById('custom').classList.contains('active')) {
                let cIn = parseFloat(document.getElementById('cIn').value) || 0;
                let cH1 = parseFloat(document.getElementById('cHold1').value) || 0;
                let cOut = parseFloat(document.getElementById('cOut').value) || 0;
                let cH2 = parseFloat(document.getElementById('cHold2').value) || 0;
                let tIn = document.getElementById('txtIn').value || UI[currentLang].customDefaultIn;
                let tOut = document.getElementById('txtOut').value || UI[currentLang].customDefaultOut;
                const holdLabel = { fa: "حبس", en: "Hold" };

                let customPhases = [];
                if (cIn > 0) customPhases.push({ text: { fa: tIn, en: tIn }, duration: cIn, action: "expand" });
                if (cH1 > 0) customPhases.push({ text: holdLabel, duration: cH1, action: "hold" });
                if (cOut > 0) customPhases.push({ text: { fa: tOut, en: tOut }, duration: cOut, action: "contract" });
                if (cH2 > 0) customPhases.push({ text: holdLabel, duration: cH2, action: "hold" });

                if (customPhases.length === 0) return alert(UI[currentLang].alertMinInput);
                currentMethod = { name: { fa: "سفارشی", en: "Custom" }, type: "custom", desc: { fa: "تایمر سفارشی", en: "Custom timer" }, phases: customPhases };
            }

            if (document.getElementById('apnea').classList.contains('active')) {
                let type = document.getElementById('apneaType').value;
                let base = parseInt(document.getElementById('apneaBase').value) || 30;
                currentMethod = generateApneaTable(type, base);
            }

            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            currentPhaseIndex = 0;
            sessionStartTime = Date.now();

            runPhase();
            animateParticles();
        }

        function runPhase() {
            if (!isRunning) return;

            const phase = currentMethod.phases[currentPhaseIndex];
            const label = phase.text[currentLang];
            phaseText.innerText = label;

            if (settings.voice && phase.duration >= 2.0) speak(label);
            // صدای متفاوت برای متد تاکتیکی
            if (currentMethod.type === "tactical") playBeep(500);
            else playBeep(300);

            if (navigator.vibrate) navigator.vibrate(50);

            if (phase.action === "expand") {
                shape.style.transition = `transform ${phase.duration}s ease-in-out, border-radius ${phase.duration}s, box-shadow ${phase.duration}s`;
                shape.style.transform = 'scale(1.4)';
                shape.style.borderRadius = '50%'; // دایره
                shape.style.boxShadow = '0 0 60px rgba(255, 255, 255, 0.6)';
                document.body.style.backgroundColor = '#0a0a0a';
                createParticles('expand');
            } else if (phase.action === "contract") {
                shape.style.transition = `transform ${phase.duration}s ease-in-out, border-radius ${phase.duration}s, box-shadow ${phase.duration}s`;
                shape.style.transform = 'scale(0.8)';
                shape.style.borderRadius = '50%'; // دایره
                shape.style.boxShadow = '0 0 10px rgba(255, 255, 255, 0.1)';
                document.body.style.backgroundColor = '#000000';
                createParticles('contract');
            } else if (phase.action === "hold") {
                shape.style.transition = `transform 0.5s ease-in-out, border-radius 0.5s`;
                shape.style.transform = 'scale(1.1)'; // کمی بزرگتر ولی ثابت
                shape.style.borderRadius = '10%'; // تبدیل به مربع!
            }

            let timeLeft = phase.duration;
            countdown.innerText = timeLeft.toFixed(1);
            clearInterval(countdownInterval);
            const startTime = Date.now();

            countdownInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const remaining = Math.max(0, phase.duration - elapsed);
                countdown.innerText = remaining.toFixed(1);
            }, 50);

            phaseTimeout = setTimeout(() => {
                clearInterval(countdownInterval);
                currentPhaseIndex = (currentPhaseIndex + 1) % currentMethod.phases.length;

                // اگر به اول رسید (یک راند تمام شد) و ویم هوف بود، توقف کن
                if (currentPhaseIndex === 0 && (currentMethod.type === "wimhof" || currentMethod.type === "apnea")) {
                    stopBreathing(false);
                    return;
                }
                runPhase();
            }, phase.duration * 1000);
        }

        function stopBreathing(manualStop = false) {
            isRunning = false;
            clearTimeout(phaseTimeout);
            clearInterval(countdownInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;

            shape.style.transition = 'transform 1s ease-in-out, border-radius 1s, box-shadow 1s';
            shape.style.transform = 'scale(1)';
            shape.style.borderRadius = '50%';
            shape.style.boxShadow = '0 0 30px rgba(255, 255, 255, 0.2)';
            document.body.style.backgroundColor = '#000000';
            phaseText.innerText = UI[currentLang].ready;
            countdown.innerText = "";
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ذخیره زمان جلسه
            if (!manualStop && sessionStartTime) {
                let duration = Math.round((Date.now() - sessionStartTime) / 1000);
                if (duration > 5) saveSession(duration);
            }
            sessionStartTime = 0;

            if (manualStop) window.speechSynthesis.cancel();
        }

        // --- PWA Install Prompt ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'inline-flex';
        });
        document.getElementById('installBtn').addEventListener('click', (e) => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('installBtn').style.display = 'none'; });
            }
        });

        // مقداردهی اولیه
        updateMethodInfo();
        updateStatsUI();
        updateApneaInfo();
        applyLanguage();
    </script>
</body>
</html>
