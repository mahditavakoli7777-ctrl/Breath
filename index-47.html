    <title>Ultimate Breath Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px;
            padding-top: max(8px, env(safe-area-inset-top));
            transition: background-color 4s ease;
        }

        /* تم‌های رنگی محیطی */
        body.theme-sleep { background-color: #020308; }
        body.theme-energy { background-color: #0a0805; }
        body.theme-stress { background-color: #050a08; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 14px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .stats { color: #fff; font-weight: 700; display: flex; gap: 10px; cursor: pointer; }
        .toggles button, .install-btn {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 5px 9px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 4px;
            transition: 0.2s;
        }
        .toggles button.active, .install-btn { color: #fff; border-color: #fff; display: inline-flex; align-items: center; gap: 3px;}

        h1 {
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 20px;
            flex-shrink: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px;
            max-width: 500px;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .tab {
            flex: 1;
            padding: 8px 5px;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-size: 13px;
        }
        .tab.active { color: #fff; border-bottom-color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background-color: #111111;
            color: #fff;
            border: 1px solid #333;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .description {
            font-size: 13px;
            color: #888;
            margin-bottom: 14px;
            min-height: 34px;
            line-height: 1.5;
        }

        #particleCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .breath-circle-container {
            width: 170px;
            height: 170px;
            margin: 0 auto 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            flex-shrink: 1;
        }

        .breath-shape {
            width: 130px;
            height: 130px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 4s ease-in-out, border-radius 4s ease-in-out, box-shadow 2s;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* نقاط تمرکز چشم در حالت تمام صفحه */
        .focus-points {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }
        .fp {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
        }

        .phase-text { font-size: 20px; font-weight: 700; color: #000; padding: 0 10px; }
        .countdown { font-size: 16px; margin-top: 4px; font-weight: 300; color: #333; }

        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; flex-shrink: 0; }
        button { padding: 11px 24px; border: none; border-radius: 50px; font-size: 15px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-start { background: #fff; color: #000; }
        .btn-stop { background: transparent; color: #fff; border: 1px solid #fff; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .routine-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .routine-btns button { flex: 1; background: #222; color: #fff; border: 1px solid #444; min-width: 100px;}

        /* مودال آمار */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid #333;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 20px;
        }
        .cal-day {
            aspect-ratio: 1;
            background: #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #555;
        }
        .cal-day.active { background: #fff; color: #000; font-weight: bold; }

        .container.fullscreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            max-width: 100%; height: 100vh; height: 100dvh;
            background: #000; border: none; border-radius: 0;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 999;
        }
        .container.fullscreen .top-bar,
        .container.fullscreen h1,
        .container.fullscreen .tabs,
        .container.fullscreen .description { display: none; }
        .container.fullscreen .focus-points { display: block; }
        .exit-fullscreen {
            position: absolute; top: 20px; left: 20px;
            background: transparent; border: 1px solid #333;
            color: #fff; border-radius: 50%;
            width: 40px; height: 40px; display: none;
        }
        .container.fullscreen .exit-fullscreen { display: block; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <button class="exit-fullscreen" onclick="toggleFullscreen()">✕</button>
        <div class="focus-points">
            <div class="fp" style="top: 10%; left: 50%;"></div>
            <div class="fp" style="top: 50%; left: 10%;"></div>
            <div class="fp" style="top: 50%; left: 90%;"></div>
            <div class="fp" style="top: 90%; left: 50%;"></div>
        </div>

        <div class="top-bar">
            <div class="stats" onclick="openStats()">
                <span id="streakCounter">🔥 0 روز</span>
                <span id="totalMinutes">⏱️ 0 دقیقه</span>
            </div>
            <div class="toggles">
                <button id="installBtn" class="install-btn" style="display:none">📥 نصب</button>
                <button id="soundToggle" onclick="toggleSetting('sound')">🔊</button>
                <button id="langToggle" onclick="toggleLanguage()">🌐 EN</button>
                <button onclick="toggleFullscreen()">⛶</button>
            </div>
        </div>

        <h1>BREATH TIMER</h1>

        <div class="tabs">
            <div class="tab active" id="tabPresets" onclick="switchTab('presets')">پیش‌فرض</div>
            <div class="tab" id="tabCustom" onclick="switchTab('custom')">سفارشی</div>
            <div class="tab" id="tabRoutines" onclick="switchTab('routines')">روتین‌ها</div>
            <div class="tab" id="tabApnea" onclick="switchTab('apnea')">غواصی</div>
        </div>

        <!-- تب پیش‌فرض -->
        <div id="presets" class="tab-content active">
            <select id="methodSelect" onchange="updateMethodInfo()">

            document.getElementById('streakCounter').innerText = UI[currentLang].streak(streak);
            document.getElementById('totalMinutes').innerText = UI[currentLang].minutes(mins);
        }

        function saveSession(durationSecs) {
            let today = new Date().toDateString();
            let lastDate = localStorage.getItem('breathLastDate');

            if (lastDate !== today) {
                let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                let streak = parseInt(localStorage.getItem('breathStreak') || 0);
                if (lastDate === yesterday.toDateString()) streak += 1;
                else streak = 1;
                localStorage.setItem('breathStreak', streak);
                localStorage.setItem('breathLastDate', today);
                localStorage.setItem('breathDate-'+today, 'true');
            }

            let total = parseInt(localStorage.getItem('breathTotalSecs') || 0);
            localStorage.setItem('breathTotalSecs', total + durationSecs);
            updateStatsUI();
        }

        function openStats() {
            let modal = document.getElementById('statsModal');
            let grid = document.getElementById('calendarGrid');

            let today = new Date();

                let div = document.createElement('div');
                div.className = 'cal-day' + (localStorage.getItem('breathDate-'+dStr) ? ' active' : '');

                grid.appendChild(div);
            }
            modal.style.display = 'flex';

        function generateApneaTable(type, baseTime) {
            let phases = [];
            if(type === 'co2') {
                for(let i=0; i<8; i++) {
                    let restTime = Math.max(15, 60 - (i*7)); // استراحت کم میشه

                    phases.push({ text: { fa: `حبس نفس (${baseTime}s)`, en: `Breath hold (${baseTime}s)` }, duration: baseTime, action: "hold" });
                }
            } else {
                for(let i=0; i<8; i++) {
                    phases.push({ text: { fa: `آماده (استراحت 60s)`, en: `Ready (rest 60s)` }, duration: 60, action: "contract" });
                    let holdTime = baseTime + (i*7); // حبس بیشتر میشه
                    phases.push({ text: { fa: `حبس نفس (${holdTime}s)`, en: `Breath hold (${holdTime}s)` }, duration: holdTime, action: "hold" });
                }
            }
            return { name: { fa: "آپنه", en: "Apnea" }, type: "apnea", desc: { fa: "جدول تمرین غواصی.", en: "Freediving training table." }, phases: phases };

            stopBreathing(true);

            document.getElementById(tabName).classList.add('active');
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

            currentMethod = methods[methodSelect.value];
            document.getElementById('methodDescription').innerText = currentMethod.desc[currentLang];
            stopBreathing(true);
        }

            document.body.className = ''; // ریست تم
            switchTab('presets');
            if (type === 'sleep') { methodSelect.value = 'weil_478'; document.body.classList.add('theme-sleep'); }
            if (type === 'stress') { methodSelect.value = 'coherent_55'; document.body.classList.add('theme-stress'); }
            if (type === 'energy') { methodSelect.value = 'bhastrika_11'; document.body.classList.add('theme-energy'); }
            updateMethodInfo();
            startBreathing();
        }

        // --- صدا ---
        function toggleSetting(type) {
            settings[type] = !settings[type];
            document.getElementById(type + 'Toggle').classList.toggle('active', settings[type]);
            if (settings.sound && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(freq = 300) {
            if (!settings.sound || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function speak(text) {
            if (!settings.voice) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = currentLang === 'fa' ? 'fa-IR' : 'en-US'; u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        // --- زبان / Language ---
        function toggleLanguage() {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            localStorage.setItem('breathLang', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const t = UI[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

            document.getElementById('tabPresets').innerText = t.tabPresets;
            document.getElementById('tabCustom').innerText = t.tabCustom;
            document.getElementById('tabRoutines').innerText = t.tabRoutines;
            document.getElementById('tabApnea').innerText = t.tabApnea;

            // گزینه‌های متد
            Object.keys(t.methodOptions).forEach(key => {
                const opt = methodSelect.querySelector(`option[value="${key}"]`);
                if (opt) opt.innerText = t.methodOptions[key];
            });
            document.getElementById('methodDescription').innerText = currentMethod.desc[currentLang];

            document.getElementById('lblCIn').innerText = t.lblCIn;
            document.getElementById('lblCHold1').innerText = t.lblCHold1;
            document.getElementById('lblCOut').innerText = t.lblCOut;
            document.getElementById('lblCHold2').innerText = t.lblCHold2;
            document.getElementById('lblTxtIn').innerText = t.lblTxtIn;
            document.getElementById('lblTxtOut').innerText = t.lblTxtOut;
            document.getElementById('customDesc').innerText = t.customDesc;

            // اگر ورودی کلمه هنوز مقدار پیش‌فرض زبان قبلی بود، به زبان جدید سوییچ کن
            const otherLang = currentLang === 'fa' ? 'en' : 'fa';
            const txtIn = document.getElementById('txtIn');
            const txtOut = document.getElementById('txtOut');
            if (txtIn.value === UI[otherLang].customDefaultIn) txtIn.value = t.customDefaultIn;
            if (txtOut.value === UI[otherLang].customDefaultOut) txtOut.value = t.customDefaultOut;

            document.getElementById('routinesDesc').innerText = t.routinesDesc;
            document.getElementById('btnSleep').innerText = t.btnSleep;
            document.getElementById('btnStress').innerText = t.btnStress;
            document.getElementById('btnEnergy').innerText = t.btnEnergy;

            document.getElementById('lblApneaBase').innerText = t.lblApneaBase;
            Object.keys(t.apneaOptions).forEach(key => {
                const opt = document.querySelector(`#apneaType option[value="${key}"]`);
                if (opt) opt.innerText = t.apneaOptions[key];
            });
            updateApneaInfo();

            if (!isRunning) phaseText.innerText = t.ready;
            startBtn.innerText = t.start;
            stopBtn.innerText = t.stop;

            document.getElementById('modalTitle').innerText = t.modalTitle;
            document.getElementById('modalCloseBtn').innerText = t.modalClose;

            document.getElementById('installBtn').innerText = t.installBtn;
            document.getElementById('langToggle').innerText = t.langBtn;

            updateStatsUI();
        }

        // --- فول اسکرین ---
        function toggleFullscreen() { document.getElementById('mainContainer').classList.toggle('fullscreen'); }

        // --- ذرات ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function createParticles(action) {
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({ x: canvas.width / 2, y: canvas.height / 2, angle: Math.random() * Math.PI * 2, speed: Math.random() * 0.5 + 0.5, action });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            particles.forEach(p => {
                if (p.action === 'expand') { p.x += Math.cos(p.angle) * p.speed; p.y += Math.sin(p.angle) * p.speed; }
                else if (p.action === 'contract') { p.x -= Math.cos(p.angle) * p.speed; p.y -= Math.sin(p.angle) * p.speed; }
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
            });
            if (isRunning) requestAnimationFrame(animateParticles);
        }

        // --- شروع تمرین ---
        function startBreathing() {
            if (document.getElementById('custom').classList.contains('active')) {
                let cIn = parseFloat(document.getElementById('cIn').value) || 0;
                let cH1 = parseFloat(document.getElementById('cHold1').value) || 0;
                let cOut = parseFloat(document.getElementById('cOut').value) || 0;
                let cH2 = parseFloat(document.getElementById('cHold2').value) || 0;
                let tIn = document.getElementById('txtIn').value || UI[currentLang].customDefaultIn;
                let tOut = document.getElementById('txtOut').value || UI[currentLang].customDefaultOut;
                const holdLabel = { fa: "حبس", en: "Hold" };

                let customPhases = [];
                if (cIn > 0) customPhases.push({ text: { fa: tIn, en: tIn }, duration: cIn, action: "expand" });
                if (cH1 > 0) customPhases.push({ text: holdLabel, duration: cH1, action: "hold" });
                if (cOut > 0) customPhases.push({ text: { fa: tOut, en: tOut }, duration: cOut, action: "contract" });
                if (cH2 > 0) customPhases.push({ text: holdLabel, duration: cH2, action: "hold" });

                if (customPhases.length === 0) return alert(UI[currentLang].alertMinInput);
                currentMethod = { name: { fa: "سفارشی", en: "Custom" }, type: "custom", desc: { fa: "تایمر سفارشی", en: "Custom timer" }, phases: customPhases };
            }

            if (document.getElementById('apnea').classList.contains('active')) {
                let type = document.getElementById('apneaType').value;
                let base = parseInt(document.getElementById('apneaBase').value) || 30;
                currentMethod = generateApneaTable(type, base);
            }

            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            currentPhaseIndex = 0;
            sessionStartTime = Date.now();

            runPhase();
            animateParticles();
        }

        function runPhase() {
            if (!isRunning) return;

            const phase = currentMethod.phases[currentPhaseIndex];
            const label = phase.text[currentLang];
            phaseText.innerText = label;

            if (settings.voice && phase.duration >= 2.0) speak(label);
            // صدای متفاوت برای متد تاکتیکی
            if (currentMethod.type === "tactical") playBeep(500);
            else playBeep(300);

            if (navigator.vibrate) navigator.vibrate(50);

            if (phase.action === "expand") {
                shape.style.transition = `transform ${phase.duration}s ease-in-out, border-radius ${phase.duration}s, box-shadow ${phase.duration}s`;
                shape.style.transform = 'scale(1.4)';
                shape.style.borderRadius = '50%'; // دایره
                shape.style.boxShadow = '0 0 60px rgba(255, 255, 255, 0.6)';
                document.body.style.backgroundColor = '#0a0a0a';
                createParticles('expand');
            } else if (phase.action === "contract") {
                shape.style.transition = `transform ${phase.duration}s ease-in-out, border-radius ${phase.duration}s, box-shadow ${phase.duration}s`;
                shape.style.transform = 'scale(0.8)';
                shape.style.borderRadius = '50%'; // دایره
                shape.style.boxShadow = '0 0 10px rgba(255, 255, 255, 0.1)';
                document.body.style.backgroundColor = '#000000';
                createParticles('contract');
            } else if (phase.action === "hold") {
                shape.style.transition = `transform 0.5s ease-in-out, border-radius 0.5s`;
                shape.style.transform = 'scale(1.1)'; // کمی بزرگتر ولی ثابت
                shape.style.borderRadius = '10%'; // تبدیل به مربع!
            }

            let timeLeft = phase.duration;
            countdown.innerText = timeLeft.toFixed(1);
            clearInterval(countdownInterval);
            const startTime = Date.now();

            countdownInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const remaining = Math.max(0, phase.duration - elapsed);
                countdown.innerText = remaining.toFixed(1);
            }, 50);

            phaseTimeout = setTimeout(() => {
                clearInterval(countdownInterval);
                currentPhaseIndex = (currentPhaseIndex + 1) % currentMethod.phases.length;

                // اگر به اول رسید (یک راند تمام شد) و ویم هوف بود، توقف کن
                if (currentPhaseIndex === 0 && (currentMethod.type === "wimhof" || currentMethod.type === "apnea")) {
                    stopBreathing(false);
                    return;
                }
                runPhase();
            }, phase.duration * 1000);
        }

        function stopBreathing(manualStop = false) {
            isRunning = false;
            clearTimeout(phaseTimeout);
            clearInterval(countdownInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;

            shape.style.transition = 'transform 1s ease-in-out, border-radius 1s, box-shadow 1s';
            shape.style.transform = 'scale(1)';
            shape.style.borderRadius = '50%';
            shape.style.boxShadow = '0 0 30px rgba(255, 255, 255, 0.2)';
            document.body.style.backgroundColor = '#000000';
            phaseText.innerText = UI[currentLang].ready;
            countdown.innerText = "";
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ذخیره زمان جلسه
            if (!manualStop && sessionStartTime) {
                let duration = Math.round((Date.now() - sessionStartTime) / 1000);
                if (duration > 5) saveSession(duration);
            }
            sessionStartTime = 0;

            if (manualStop) window.speechSynthesis.cancel();
        }

        // --- PWA Install Prompt ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'inline-flex';
        });
        document.getElementById('installBtn').addEventListener('click', (e) => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('installBtn').style.display = 'none'; });
            }
        });

        // مقداردهی اولیه
        updateMethodInfo();
        updateStatsUI();
        updateApneaInfo();
        applyLanguage();
    </script>
    <script>
        // ثبت Service Worker به‌صورت اینلاین (بدون نیاز به فایل جداگانه)
        // این کار باعث می‌شود برنامه به‌صورت PWA نصب‌شدنی و آفلاین کار کند.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'breath-timer-cache-v1';

                    self.addEventListener('install', (event) => {
                        event.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => cache.add(self.registration.scope))
                        );
                        self.skipWaiting();
                    });

                    self.addEventListener('activate', (event) => {
                        event.waitUntil(
                            caches.keys().then((keys) =>
                                Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))
                            )
                        );
                        self.clients.claim();
                    });

                    self.addEventListener('fetch', (event) => {
                        if (event.request.method !== 'GET') return;
                        event.respondWith(
                            caches.match(event.request).then((cached) => {
                                if (cached) return cached;
                                return fetch(event.request).then((res) => {
                                    const clone = res.clone();
                                    caches.open(CACHE_NAME).then((cache) => cache.put(event.request, clone));
                                    return res;
                                }).catch(() => cached);
                            })
                        );
                    });
                `;

                try {
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).catch((err) => {
                        console.warn('Service worker registration failed:', err);
                    });
                } catch (err) {
                    console.warn('Service worker not supported in this browser:', err);
                }
            });
        }
    </script>
</body>
